[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-store"
version = "0.1.0"
description = "Persistent multi-store skills over MCP stdio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastmcp>=4.0.2,<5", "boto3>=1.35,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "moto[s3]>=5,<6", "ruff"]

[project.scripts]
skill-store = "skill_store.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_store"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires a real MinIO endpoint"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
